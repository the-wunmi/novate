name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: novate
          POSTGRES_PASSWORD: novate
          POSTGRES_DB: novate
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U novate"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=novate psql -h localhost -p 5433 -U novate -c 'create database novate_dbos'
      - run: cp .env.example .env
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
