services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: novate
      POSTGRES_PASSWORD: novate
      POSTGRES_DB: novate
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novate"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
